<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guia de Férias</title>
    <link rel="stylesheet" href="../style/style.css" />
</head>

<body>
    <header>
        <h1>Guia de Férias</h1>
    </header>
    <main>
        <section>
            <h2>Destinos</h2>
            <p>
                Selecione um destino para visualizar seus detalhes
            </p>
            <!-- Os cards dos destinos serão criados pelo JavaScript -->
            <div id="lista-destinos">
                <p>Carregando destinos...</p>
            </div>
        </section>
        <section id="detalhes">
            <h2>Destino selecionado</h2>
            <!-- Os dados do destino selecionado aparecerão aqui -->
            <div id="detalhes-destino">
                <p>Selecione um destino para visualizar os detalhes.</p>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
